[package]
name = "openblock-desktop"
version = "2.5.0"
description = "OpenBlock ESP32 desktop shell and hardware-link service"
authors = ["OpenBlock contributors"]
license = ""
repository = "https://github.com/BUG423/OpenBlock-ESP32"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1.0", features = ["derive"] }
openblock-link-rs = { path = "./openblock-link-rs" }
serde_json = "1.0"
log = "0.4"
espflash = { version = "4.5.0", default-features = false, features = ["serialport"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
sha2 = "0.11.0"
serialport = { version = "4.10.0", default-features = false }

[features]
# Required when devPath points to packaged application assets.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
