[package]
name = "openblock-link-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
env_logger = "0.11"
futures-util = "0.3"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = [] }
# Keep Linux builds self-contained when libudev headers are unavailable.
# Serial devices remain accessible through the platform's native /dev paths.
serialport = { version = "4.8", default-features = false }
tokio = { version = "1.47", features = ["full"] }
tokio-tungstenite = "0.30"
# websocket = "0.27.1"
